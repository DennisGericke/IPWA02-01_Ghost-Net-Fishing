<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shea Shepherd - Geisternetz-Übersicht</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🌊 Shea Shepherd - Bergungskoordination</span>
            <a href="/melden" class="btn btn-outline-light btn-sm">➕ Neues Netz melden</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Übersicht der gemeldeten Geisternetze</h5>
            </div>
            <div class="card-body">
                
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Breitengrad (Latitude)</th>
                            <th>Längengrad (Longitude)</th>
                            <th>Größe (Meter)</th>
                            <th>Aktueller Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="netz : ${netze}">
                            <td th:text="${netz.id}">1</td>
                            <td th:text="${netz.latitude}">54.1234</td>
                            <td th:text="${netz.longitude}">10.5678</td>
                            <td th:text="${netz.groesse}">25</td>
                            <td>
                                <span class="badge bg-info text-dark" th:text="${netz.status}">GEMELDET</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
            </div>
        </div>
    </div>

</body>
</html>
